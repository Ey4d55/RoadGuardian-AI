name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dashboard.txt
      - run: python review_project.py
      - run: python package_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: RoadGuardian-source
          path: RoadGuardian_AI_Edge_Package.zip
